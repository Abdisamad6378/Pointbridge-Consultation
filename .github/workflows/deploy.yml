name: Deploy PointBridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, pointbridge]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: Restart application
        run: |
          pm2 restart pointbridge || pm2 start dist/main.js --name pointbridge

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://localhost:3000/ || curl -fsS http://localhost:3000/health